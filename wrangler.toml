# wrangler.toml - Cloudflare Pages configuration for webtree-chatbot-front
# Recreate the Pages project and bindings in the Cloudflare dashboard before deploying.
# Pages Functions do not support Cron Triggers, so the cron worker stays separate.

name = "webtree-chatbot-front"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

[dev]
port = 8788

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "VOICE_KV"
id = "b37aa1043f544632a002618ec4270bc2"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "knowledgeos-assets"

[[d1_databases]]
binding = "DB"
database_name = "knowledgeos_app"
database_id = "c54b61b6-2f7b-4851-b3af-c44d489234b7"

# D1 backs the application metadata layer for Pages Functions.
# Apply: schema-knowledgeos-d1.sql
#
# Cloudflare Dashboard variables to recreate:
# NEXT_PUBLIC_SITE_URL=https://aiassistant.webtreeedu.com
# NEXT_PUBLIC_SUPABASE_URL=https://xxxxxxxx.supabase.co
# NEXT_PUBLIC_SUPABASE_ANON_KEY=...
# SUPABASE_SERVICE_KEY=...
# SUPABASE_JWT_ISS=...
# SUPABASE_JWT_AUD=authenticated
# CHAT_BACKEND_URL=https://webtree-chatbot-back.<your-workers-domain>
# OPENAI_MODEL=gpt-4.1-nano
# RAG_API_URL=https://rag.webtreeedu.com
# RAG_API_KEY=... (if the external RAG service is protected)
# RAG_REQUEST_TIMEOUT_MS=5000
# CRON_SECRET=...
