# workers/wrangler-cron.toml - standalone cron worker for KnowledgeOS
# Deploy separately because Pages Functions do not support Cron Triggers.

name = "knowledgeos-cron"
main = "cron-worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 2 * * *"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "VOICE_KV"
id = "b37aa1043f544632a002618ec4270bc2"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "knowledgeos-assets"

# Recreate the same D1 database binding here only if the cron worker later needs metadata access.
# For now the cron worker only needs auth + storage bindings.
#
# Recreate these secrets in the Worker namespace:
# DEEPINFRA_API_KEY
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# CRON_SECRET
