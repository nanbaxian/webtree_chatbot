# Legacy Cloudflare Worker mock/adapter.
# The primary runtime for the external RAG service is now `server.cjs`.

name = "knowledgeos-rag"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
RAG_DB_URL = "https://your-rag-db.example.com"

# Add secrets in the Cloudflare dashboard or via `wrangler secret put`
# RAG_DB_TOKEN
# RAG_MOCK_JSON
